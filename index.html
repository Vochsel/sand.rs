<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sand.rs — generative sand art</title>
  </head>
  <body>
    <div id="app">
      <div id="container">
        <aside id="sidebar">
          <div>
            <h1>sand<span>.rs</span></h1>
            <p class="tagline">Generative sand art · WebGPU · by Ben Skinner</p>
          </div>

          <div class="section">
            <h2>Example</h2>
            <select id="examples_select"></select>
          </div>

          <div class="section">
            <h2>Editor (WGSL)</h2>
            <div id="editor_host"></div>
          </div>

          <div class="section">
            <h2>Render</h2>
            <div class="button-row">
              <button id="btn_toggle">Pause</button>
              <button id="btn_reset">Reset</button>
            </div>
            <div class="button-row">
              <button id="btn_view_reset">Reset View</button>
              <button id="btn_export" class="primary">Export PNG</button>
            </div>
          </div>

          <div class="section">
            <h2>Buffer</h2>
            <div class="size-row">
              <div>
                <label for="buffer_w">Width</label>
                <input id="buffer_w" type="number" min="64" step="64" value="1024" />
              </div>
              <div>
                <label for="buffer_h">Height</label>
                <input id="buffer_h" type="number" min="64" step="64" value="1024" />
              </div>
            </div>
          </div>

          <div class="section">
            <h2>Style</h2>
            <div class="row">
              <label>Background</label>
              <input id="bg_input" type="color" />
              <input id="bg_output" type="text" />
            </div>
            <div class="row">
              <label>Sand color</label>
              <input id="sand_input" type="color" />
              <input id="sand_output" type="text" />
            </div>
            <div class="row">
              <label>Sand size</label>
              <input id="size_input" type="range" min="0.002" max="0.5" step="0.0005" />
              <input id="size_output" type="text" />
            </div>
            <div class="row">
              <label>Opacity</label>
              <input id="opacity_input" type="range" min="0.0025" max="1.0" step="0.0025" />
              <input id="opacity_output" type="text" />
            </div>
            <div class="row">
              <label>Grains</label>
              <input id="amount_input" type="range" min="50" max="4000" step="10" />
              <input id="amount_output" type="text" />
            </div>
          </div>
        </aside>

        <main id="viewer">
          <canvas id="viewer_canvas"></canvas>
          <div id="error_banner"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
